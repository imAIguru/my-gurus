name: OCI A1 Capacity Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: oci-a1-capacity-watcher
  cancel-in-progress: false

jobs:
  check-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_HOME_REGION: me-dubai-1
      OCI_SHAPE: VM.Standard.A1.Flex
      OCI_PRIORITY_REGIONS: me-riyadh-1,me-jeddah-1,me-dubai-1,me-abudhabi-1,ap-mumbai-1,ap-hyderabad-1
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oci-a1-capacity-watcher/requirements.txt

      - name: Install OCI SDK
        run: pip install -r oci-a1-capacity-watcher/requirements.txt

      - name: Check all subscribed regions - 2 OCPU / 12 GB
        id: capacity_2_12
        env:
          OCI_OCPUS: "2"
          OCI_MEMORY_GB: "12"
        run: python oci-a1-capacity-watcher/check_capacity.py

      - name: Save 2 OCPU / 12 GB report
        run: |
          mv capacity-report.json capacity-report-2ocpu-12gb.json
          mv capacity-report.md capacity-report-2ocpu-12gb.md

      - name: Upload 2 OCPU / 12 GB report
        uses: actions/upload-artifact@v4
        with:
          name: oci-a1-capacity-report-2ocpu-12gb
          path: |
            capacity-report-2ocpu-12gb.json
            capacity-report-2ocpu-12gb.md
          retention-days: 7

      - name: URGENT alert - 2 OCPU / 12 GB available
        if: steps.capacity_2_12.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AVAILABLE_REGIONS: ${{ steps.capacity_2_12.outputs.available_regions }}
          AVAILABLE_LOCATIONS: ${{ steps.capacity_2_12.outputs.available_locations }}
        run: |
          existing="$(gh issue list --state open --search 'URGENT OCI A1 AVAILABLE - 2 OCPU / 12 GB in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Urgent 2/12 capacity alert already exists: #$existing"
          else
            {
              echo "@imAIguru **URGENT: OCI A1 capacity is AVAILABLE now.**"
              echo
              echo "Requested size: **2 OCPU / 12 GB RAM**"
              echo "Shape: **VM.Standard.A1.Flex**"
              echo "Available region(s): $AVAILABLE_REGIONS"
              echo "Available location(s): $AVAILABLE_LOCATIONS"
              echo
              echo "Capacity can disappear quickly. Open OCI and try creating the instance immediately."
              echo
              cat capacity-report-2ocpu-12gb.md
            } > /tmp/issue-body-2-12.md
            gh issue create \
              --title "URGENT OCI A1 AVAILABLE - 2 OCPU / 12 GB" \
              --body-file /tmp/issue-body-2-12.md \
              --assignee imAIguru
          fi

      - name: Check all subscribed regions - 1 OCPU / 6 GB
        id: capacity_1_6
        env:
          OCI_OCPUS: "1"
          OCI_MEMORY_GB: "6"
        run: python oci-a1-capacity-watcher/check_capacity.py

      - name: Save 1 OCPU / 6 GB report
        run: |
          mv capacity-report.json capacity-report-1ocpu-6gb.json
          mv capacity-report.md capacity-report-1ocpu-6gb.md

      - name: Upload 1 OCPU / 6 GB report
        uses: actions/upload-artifact@v4
        with:
          name: oci-a1-capacity-report-1ocpu-6gb
          path: |
            capacity-report-1ocpu-6gb.json
            capacity-report-1ocpu-6gb.md
          retention-days: 7

      - name: URGENT alert - 1 OCPU / 6 GB available
        if: steps.capacity_1_6.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AVAILABLE_REGIONS: ${{ steps.capacity_1_6.outputs.available_regions }}
          AVAILABLE_LOCATIONS: ${{ steps.capacity_1_6.outputs.available_locations }}
        run: |
          existing="$(gh issue list --state open --search 'URGENT OCI A1 AVAILABLE - 1 OCPU / 6 GB in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Urgent 1/6 capacity alert already exists: #$existing"
          else
            {
              echo "@imAIguru **URGENT: OCI A1 capacity is AVAILABLE now.**"
              echo
              echo "Requested size: **1 OCPU / 6 GB RAM**"
              echo "Shape: **VM.Standard.A1.Flex**"
              echo "Available region(s): $AVAILABLE_REGIONS"
              echo "Available location(s): $AVAILABLE_LOCATIONS"
              echo
              echo "Capacity can disappear quickly. Open OCI and try creating the instance immediately."
              echo
              cat capacity-report-1ocpu-6gb.md
            } > /tmp/issue-body-1-6.md
            gh issue create \
              --title "URGENT OCI A1 AVAILABLE - 1 OCPU / 6 GB" \
              --body-file /tmp/issue-body-1-6.md \
              --assignee imAIguru
          fi
